<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rareness</title>
<meta name="description" content="Rareness: daily rituals, and the people who share the most with you, floating closest.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rareness">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
<div id="app">
  <section class="view" id="v0" aria-label="Agenda">
    <div class="scroll" data-nav="nb0"><div class="stack" id="agendaBody"></div></div>
    <header class="navbar" id="nb0">Agenda</header>
  </section>



  <section class="view" id="v2" aria-label="Cloud" hidden>
    <div style="position:absolute;inset:0">
      <div class="stage" id="stage"><div class="world" id="world"></div></div>
      <div class="cloudhead">
        <div style="display:flex;flex-direction:column;gap:6px">
          <span class="brand">Rareness</span>
          <h1 class="largetitle">Cloud</h1>
          <p class="muted" style="margin:0;font-size:14px">Closer and bigger means more in common.</p>
        </div>
        <button class="gbtn glass" id="legendBtn" aria-label="What the reflections mean" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="8.5"></circle><path d="M7.5 9.5c.6-1.6 1.8-2.7 3.3-3.2M16.8 13c-.3 1.5-1.2 2.8-2.5 3.6"></path></svg>
        </button>
      </div>
      <div class="legend closed" id="legend" role="dialog" aria-label="What the reflections mean"></div>
      <div class="zoomctl glass">
        <button id="zIn" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M5 12h14M12 5v14"></path></svg></button>
        <span id="zLabel">78%</span>
        <button id="zOut" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
        <button id="zHome" aria-label="Recenter on you"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2.5v3.5M12 18v3.5M2.5 12H6M18 12h3.5"></path></svg></button>
      </div>
      <div class="hint glass" id="hint">Pinch to explore. Rarer matches float further out.</div>
    </div>
    <div class="lock-over" id="cloudLock" hidden></div>
  </section>

  <section class="view" id="v3" aria-label="Chats" hidden>
    <div class="scroll" data-nav="nb3"><div class="stack" id="chatsBody"></div></div>
    <header class="navbar" id="nb3">Chats</header>
    <div class="lock-over" id="chatsLock" hidden></div>
  </section>

  <!-- Sign-in, onboarding and subscription screens sit above the app until they are done -->
  <section class="gate" id="gate" hidden></section>

  <!-- Your profile: the bubble button in the top-right corner of every page -->
  <button class="mebtn" id="meBtn" aria-label="Your profile"></button>

  <div class="shade" id="shade"></div>

  <nav class="tabbar glass" id="tabbar" aria-label="Main">
    <span class="lens" id="lens"></span>
    <button class="tab on" data-tab="0" aria-label="Agenda">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"></rect><path d="M3.5 10h17M8.5 3v4M15.5 3v4"></path></svg>
    </button>
    <button class="tab" data-tab="1" aria-label="Cloud">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="9.5" cy="9.5" r="6"></circle><circle cx="17.5" cy="15.5" r="3.8"></circle><circle cx="8" cy="19.5" r="2"></circle><path d="M6.6 7.2c.5-.9 1.3-1.5 2.2-1.8" stroke-linecap="round"></path></svg>
      <span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
    </button>
    <button class="tab" data-tab="2" aria-label="Chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3.5c5 0 9 3.4 9 7.6s-4 7.6-9 7.6c-1 0-2-.1-2.9-.4L4.5 20.5l1.3-3.7C4.1 15.4 3 13.4 3 11.1 3 6.9 7 3.5 12 3.5z"></path></svg>
      <span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
    </button>
  </nav>

  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Exercise"></div>
  <div class="match" id="match" role="dialog" aria-label="You bumped into each other"></div>
  <div class="splash" id="splash" aria-label="Opening Rareness" role="img">
    <span class="flash" id="splashFlash"></span>
    <div class="core" id="splashCore"></div>
    <div class="word" id="splashWord">Rareness</div>
  </div>
  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="photoInput" accept="image/*" hidden>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
